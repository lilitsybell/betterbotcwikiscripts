name: Build Script Database

on:
  push:
    paths:
      - "scripts/**"
      - "scripts.json"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20


    - name: Build scripts-data.json
      run: node build-scripts.js


    - name: Commit changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add scripts-data.json

        git commit -m "Update scripts-data.json" || exit 0

        git push
